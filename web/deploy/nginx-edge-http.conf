server {
    listen 80;
    server_name todo100.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/history-acme;
        try_files $uri @origin_acme;
    }
    location @origin_acme {
        proxy_pass http://91.99.238.7;
        proxy_set_header Host todo100.ru;
    }
    location / {
        proxy_pass http://91.99.238.7;
        proxy_set_header Host todo100.ru;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
