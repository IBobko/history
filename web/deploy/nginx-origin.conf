server {
    listen 80;
    server_name todo100.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/history-acme;
        try_files $uri =404;
    }
    location / { return 301 https://todo100.ru$request_uri; }
}

server {
    listen 443 ssl;
    server_name todo100.ru;
    ssl_certificate /etc/letsencrypt/live/todo100.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/todo100.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
