server {
    listen 80;
    server_name todo100.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/history-acme;
        try_files $uri @origin_acme;
    }
    location @origin_acme {
        proxy_pass http://91.99.238.7;
        proxy_set_header Host todo100.ru;
    }
    location / { return 301 https://todo100.ru$request_uri; }
}

server {
    listen 443 ssl;
    server_name todo100.ru;
    ssl_certificate /etc/letsencrypt/live/todo100.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/todo100.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;

    location / {
        proxy_pass https://91.99.238.7;
        proxy_ssl_server_name on;
        proxy_ssl_name todo100.ru;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host todo100.ru;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
